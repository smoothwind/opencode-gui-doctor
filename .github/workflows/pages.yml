name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Pages site must exist once before deploying. The default GITHUB_TOKEN
      # canNOT create it (Pages creation is a repository-administration call), so
      # either:
      #   1) enable it once in the UI:  Settings -> Pages -> Build and deployment
      #      -> Source: "GitHub Actions", then re-run this workflow; or
      #   2) add a `PAGES_TOKEN` secret (classic PAT with `repo`, or a fine-grained
      #      token with Pages:write + Administration:write) and this step will
      #      enable Pages automatically via `enablement: true`.
      # With no PAGES_TOKEN the step behaves exactly as the plain default.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
